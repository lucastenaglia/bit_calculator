<html lang="es">

<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">

<style>
  :root{
    --bg:#F3F6F9;
    --panel:#FFFFFF;
    --panel-2:#F7FAFC;
    --line:#DBE3ED;
    --line-soft:#E9EEF5;
    --text:#0F1B2A;
    --muted:#5B6B80;
    --muted-2:#8A96A8;
    --accent:#0E9B86;
    --accent-dim:#39C0A8;
    --accent-soft:#E9F7F4;
    --accent-glow:rgba(14,155,134,.16);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","IBM Plex Mono","Cascadia Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #E1F2EE 0%, transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:var(--mono);
    font-size:15px;
    line-height:1.4;
    min-height:100vh;
    padding:0 0 40px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 14px;}

  /* ---------- Header ---------- */
  header{
    padding:22px 0 16px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
  .kicker{
    font-size:10px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);margin-bottom:8px;
  }
  h1{
    font-size:19px;margin:0;font-weight:600;letter-spacing:.02em;
  }
  h1 .sub{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:.14em;margin-top:6px;text-transform:uppercase;}

  /* ---------- Panels ---------- */
  .panel{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:12px;
  }
  .label{
    font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
  }

  /* ---------- Stepper ---------- */
  .config{padding:14px 16px;margin-bottom:12px;}
  .stepper{
    display:flex;align-items:center;gap:10px;margin-top:12px;
  }
  .stepper button{
    width:48px;height:48px;flex:0 0 auto;
    background:var(--panel-2);color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    font-family:var(--mono);font-size:22px;line-height:1;
    cursor:pointer;transition:.15s;
  }
  .stepper button:active{background:var(--accent-dim);color:#fff;transform:scale(.96);}
  .stepper input{
    flex:1;height:48px;text-align:center;
    background:#FFFFFF;color:var(--text);
    border:1px solid var(--line);border-radius:10px;
    font-family:var(--mono);font-size:22px;font-weight:600;
    letter-spacing:.06em;
    -moz-appearance:textfield;
  }
  .stepper input::-webkit-outer-spin-button,
  .stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .stepper input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}

  /* ---------- Result ---------- */
  .result{
    position:sticky;top:0;z-index:20;
    padding:16px;
    margin-bottom:12px;
    background:linear-gradient(180deg,#FFFFFF,#F5FAF9);
    border:1px solid var(--line);
    border-top:2px solid var(--accent);
    border-radius:12px;
    box-shadow:0 12px 30px -18px rgba(15,27,42,.35);
  }
  .result .value{
    font-size:clamp(34px,11vw,52px);
    font-weight:600;letter-spacing:.01em;
    color:var(--accent);
    line-height:1.05;
    margin:6px 0 2px;
    word-break:break-all;
    font-variant-numeric:tabular-nums;
  }
  .bases{
    display:grid;grid-template-columns:1fr;gap:8px;margin-top:14px;
    border-top:1px dashed var(--line);padding-top:12px;
  }
  .base-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:12px;}
  .base-row .k{color:var(--muted-2);letter-spacing:.14em;text-transform:uppercase;font-size:10px;flex:0 0 auto;padding-top:2px;}
  .base-row .v{
    color:#33445A;text-align:right;word-break:break-all;
    font-variant-numeric:tabular-nums;font-size:12.5px;
  }

  /* ---------- Toolbar ---------- */
  .toolbar{display:flex;gap:8px;margin-bottom:12px;}
  .toolbar button{
    flex:1;padding:11px 8px;
    background:var(--panel);color:var(--muted);
    border:1px solid var(--line);border-radius:10px;
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    cursor:pointer;transition:.15s;
  }
  .toolbar button:active{transform:scale(.98);}
  .toolbar button.on{color:var(--accent);border-color:var(--accent-dim);background:var(--accent-soft);}
  .hint{
    font-size:11.5px;color:var(--muted);line-height:1.55;
    margin:0 0 14px;padding:0 2px;
  }

  /* ---------- Grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
    gap:8px;
  }
  .bit{
    position:relative;overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 10px 12px;
    cursor:pointer;user-select:none;
    transition:.15s ease;
    display:flex;flex-direction:column;gap:10px;
  }
  .bit:active{transform:scale(.97);}
  .bit .head{display:flex;justify-content:space-between;align-items:center;gap:6px;}
  .bit .idx{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.05em;}
  .bit .pin{
    width:14px;height:14px;border-radius:4px;flex:0 0 auto;
    border:1px solid var(--line);background:#EEF2F7;transition:.15s;
  }
  .bit .dec{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;}

  .bit.sel{
    background:linear-gradient(180deg,#F1FBF8,#E6F6F2);
    border-color:var(--accent-dim);
    box-shadow:inset 0 0 0 1px var(--accent-dim), 0 6px 20px -12px var(--accent-dim);
  }
  .bit.sel .idx{color:var(--accent);}
  .bit.sel .dec{color:var(--accent);font-weight:600;}
  .bit.sel .pin{background:var(--accent);border-color:var(--accent);}
  .bit.sel .pin::after{
    content:"";display:block;width:100%;height:100%;
    background:
      linear-gradient(45deg,transparent 45%,#FFFFFF 45%,#FFFFFF 55%,transparent 55%),
      linear-gradient(-45deg,transparent 45%,#FFFFFF 45%,#FFFFFF 55%,transparent 55%);
    background-size:9px 9px;background-position:center;
  }
  .bit.sel::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">SCADA · Utility</div>
    <h1>Calculadora de Bits
      <span class="sub">Máscara numérica de interlocks bypasseados</span>
    </h1>
  </header>

  <!-- Cantidad -->
  <section class="panel config">
    <div class="label"><span>Cantidad de interlocks</span><span id="range">1 – 32</span></div>
    <div class="stepper">
      <button id="minus" aria-label="Restar">−</button>
      <input id="count" type="number" inputmode="numeric" min="1" max="32" value="15" aria-label="Cantidad de interlocks">
      <button id="plus" aria-label="Sumar">+</button>
    </div>
  </section>

  <!-- Resultado -->
  <section class="result" aria-live="polite">
    <div class="label"><span>Valor decimal</span><span id="countSel">0 / 15</span></div>
    <div class="value" id="decimal">0</div>
    <div class="bases">
      <div class="base-row"><span class="k">Binario</span><span class="v" id="binary">0</span></div>
      <div class="base-row"><span class="k">Hex</span><span class="v" id="hex">0x0</span></div>
    </div>
  </section>

  <!-- Acciones -->
  <div class="toolbar">
    <button id="all">Seleccionar todos</button>
    <button id="none">Limpiar</button>
  </div>

  <p class="hint">Demarque los interlocks a bypassear. Por defecto deben estar todos marcados.</p>

  <!-- Grilla de bits -->
  <section class="grid" id="grid"></section>

</div>

<script>
(function(){
  "use strict";

  var MAX = 32;
  var MIN = 1;

  var countInput = document.getElementById('count');
  var grid       = document.getElementById('grid');
  var decimalEl  = document.getElementById('decimal');
  var binaryEl   = document.getElementById('binary');
  var hexEl      = document.getElementById('hex');
  var countSelEl = document.getElementById('countSel');

  var count = 15;
  var selected = new Set();   // índices 0-based bypasseados

  function clamp(n){ return Math.max(MIN, Math.min(MAX, n|0)); }

  /* ---------- Modelo ---------- */
  function setCount(n){
    var prev = count;
    n = clamp(n);
    count = n;
    countInput.value = n;
    // descartar selección fuera de rango
    selected.forEach(function(i){ if(i >= count) selected.delete(i); });
    // los interlocks nuevos quedan marcados por defecto
    for(var i = prev; i < count; i++) selected.add(i);
    render();
  }

  function toggle(i){
    if(selected.has(i)) selected.delete(i); else selected.add(i);
    render();
  }

  function totalValue(){
    var sum = 0;
    selected.forEach(function(i){ sum += Math.pow(2, i); });
    return sum;
  }

  /* ---------- Render ---------- */
  function render(){
    // grilla
    var frag = document.createDocumentFragment();
    for(var i = 0; i < count; i++){
      var sel = selected.has(i);
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'bit' + (sel ? ' sel' : '');
      card.dataset.i = i;
      card.setAttribute('aria-pressed', sel ? 'true' : 'false');
      card.innerHTML =
        '<div class="head">' +
          '<span class="idx">INT ' + String(i+1).padStart(2,'0') + '</span>' +
          '<span class="pin"></span>' +
        '</div>' +
        '<div class="dec">' + formatInt(Math.pow(2, i)) + '</div>';
      frag.appendChild(card);
    }
    grid.innerHTML = '';
    grid.appendChild(frag);

    // resultado
    var val = totalValue();
    decimalEl.textContent = formatInt(val);
    binaryEl.textContent  = val === 0 ? '0' : '0b' + val.toString(2);
    hexEl.textContent     = '0x' + val.toString(16).toUpperCase();
    countSelEl.textContent = selected.size + ' / ' + count;
  }

  function formatInt(n){
    return n.toLocaleString('es-AR'); // separador de miles con punto
  }

  /* ---------- Eventos ---------- */
  grid.addEventListener('click', function(e){
    var card = e.target.closest('.bit');
    if(card) toggle(parseInt(card.dataset.i, 10));
  });

  document.getElementById('plus').addEventListener('click', function(){ setCount(count + 1); });
  document.getElementById('minus').addEventListener('click', function(){ setCount(count - 1); });

  countInput.addEventListener('input', function(){
    var v = parseInt(countInput.value, 10);
    if(!isNaN(v)) setCount(v);
  });
  countInput.addEventListener('blur', function(){ setCount(count); });

  document.getElementById('all').addEventListener('click', function(){
    selected.clear();
    for(var i = 0; i < count; i++) selected.add(i);
    render();
  });
  document.getElementById('none').addEventListener('click', function(){
    selected.clear();
    render();
  });

  /* ---------- Init ---------- */
  // Por defecto, todos los interlocks marcados
  for(var i = 0; i < count; i++) selected.add(i);
  render();
})();
</script>
</body>
</html>
